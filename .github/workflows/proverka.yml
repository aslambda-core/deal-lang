name: proverka

# [v0.8.0, раунд 9 QWEN P4] сетка на класс багов msvcrt: сборка компонентов,
# std, дифференциал 318/0 и строгое покрытие std — на трёх ОС.
on: [push, pull_request]

defaults:
  run:
    shell: bash

jobs:
  sverka:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: сборка компонентов и std (в т.ч. летопись — суд msvcrt/fcntl)
        run: |
          python deal/kompilyator.py --собрать-проект komponenty
          python deal/kompilyator.py --собрать-проект std
      - name: дифференциал deal.js ↔ питон — 318/0
        run: |
          python differ/korpus.py differ/korpus.json
          python differ/прогон_питоном.py differ/korpus.json itogi_python.json
          node differ/прогон_js.js deal.js differ/korpus.json itogi_js.json
          python differ/сверка.py itogi_python.json itogi_js.json
      - name: натив-гейт «ВМ == C» (прототип ступени 4)
        run: python differ/гейт_нативом.py differ/korpus.json
      - name: строгое покрытие std (строки/списки/деньги — 100%)
        run: |
          python deal/kompilyator.py --покрытие std/строки.deal --покрытие-отказ
          python deal/kompilyator.py --покрытие std/списки.deal --покрытие-отказ
          python deal/kompilyator.py --покрытие std/деньги.deal --покрытие-отказ
      - name: дым бенчмарка (режим аст)
        run: python skorost/bench.py аст
